<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Companion session</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1020; color: #e5e7eb;
    font: 14px/1.6 -apple-system, "Segoe UI", sans-serif; }
  .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
  .rabbit { font-size: 44px; }
  h1 { font-size: 17px; margin: 12px 0 4px; font-weight: 600; }
  p { margin: 0 0 6px; color: #9ca3af; max-width: 440px; }
  .hint { margin-top: 14px; font-size: 12px; color: #6b7280; }
</style>
</head>
<body>
<div class="wrap">
  <div class="rabbit">🐰</div>
  <h1>Companion session tab</h1>
  <p>This tab is reserved for your agent. It navigates wherever the work needs to go.</p>
  <p class="hint">The banner at the bottom shows while the agent is driving. Take over or Stop any time, or just close the tab.</p>
</div>
<script src="content.js"></script>
</body>
</html>
